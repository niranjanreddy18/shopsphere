<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ShopSphere — quality products, fair prices, fast shipping." />
    <!--
      Inter, self-hosted-quality via Google Fonts CDN, loaded with the
      preconnect + explicit weight range (400–800) a premium UI needs for
      real typographic hierarchy — thin body text through bold display
      headings — rather than relying on the browser's default UI font
      stack alone.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ShopSphere | E-Commerce Platform</title>
  </head>

  </body>
