# Nginx config for serving the built React SPA.
#
# The `try_files ... /index.html` fallback is what makes client-side
# routing (React Router) work on a hard refresh/direct link to e.g.
# /products/some-slug — without it, nginx would 404 on any path that
# isn't a real file on disk, since the SPA itself is the only thing that
# knows how to route /products/some-slug to the right component.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed build assets (Vite fingerprints filenames, so a
    # new deploy naturally gets new URLs — safe to cache aggressively).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
